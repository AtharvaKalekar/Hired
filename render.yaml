services:
  - type: web
    name: hired-backend
    env: node
    rootDir: Backend
    buildCommand: npm install && pip3 install -r ai_agent/requirements.txt
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false   # Set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set this manually in Render dashboard
      - key: SERPAPI_KEY
        sync: false   # Set this manually in Render dashboard
      - key: GROQ_API_KEY
        sync: false   # Set this manually in Render dashboard
