services:
  # Backend Web Service
  - type: web
    name: hired-backend
    env: node
    rootDir: Backend
    buildCommand: npm install && python3 -m venv ai_agent/venv && ./ai_agent/venv/bin/pip install -r ai_agent/requirements.txt
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false   # Set this manually in the Render dashboard
      - key: JWT_SECRET
        sync: false   # Set this manually in the Render dashboard
      - key: SERPAPI_KEY
        sync: false   # Set this manually in the Render dashboard
      - key: GROQ_API_KEY
        sync: false   # Set this manually in the Render dashboard

  # Frontend Static Site
  - type: static
    name: hired-frontend
    rootDir: Frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: hired-backend
          type: web
          property: host
